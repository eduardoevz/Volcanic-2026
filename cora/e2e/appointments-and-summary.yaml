appId: com.cora.app
---
# Crear una cita (app/appointments.tsx) y generar el resumen médico
# (app/summary/index.tsx) — usa los textos reales de
# locales/es/appointments.json y locales/es/summary.json.
- launchApp:
    clearState: false
- assertVisible: "Inicio"

- tapOn: "Perfil"
- tapOn: "Agenda de citas"
- tapOn:
    text: ".*(Nueva cita|Agregar cita|\\+).*"
- inputText: "Control ginecológico"
- tapOn: "Guardar"
- assertVisible: "Control ginecológico"

- tapOn: "Perfil"
- tapOn: "Resumen médico"
- tapOn:
    text: ".*(Generar|Exportar).*"
- assertVisible:
    text: ".*(PDF|resumen|compartir).*"
    optional: true
